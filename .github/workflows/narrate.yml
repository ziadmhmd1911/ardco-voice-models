          JSON
          cat > gen.py <<'PY'

          import os, sys, json, re, difflib, time, torch, numpy as np, librosa, soundfile as sf, sherpa_onnx
          from safetensors.torch import load_file
          from huggingface_hub import hf_hub_download
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          torch.set_num_threads(os.cpu_count())
          SHARD, SHARDS = int(sys.argv[1]), int(sys.argv[2])
          lines = json.load(open('script.json'))
          mine = [l for i, l in enumerate(lines) if i % SHARDS == SHARD]

          D = 'sherpa-onnx-whisper-turbo/'
          asr = sherpa_onnx.OfflineRecognizer.from_whisper(encoder=D+'turbo-encoder.int8.onnx', decoder=D+'turbo-decoder.int8.onnx',
                  tokens=D+'turbo-tokens.txt', language='ar', task='transcribe', num_threads=os.cpu_count())
          def norm(s):
              s = re.sub(r'[ً-ْٰـ]', '', s)
              s = re.sub('[إأآا]', 'ا', s).replace('ة', 'ه').replace('ى', 'ي')
              s = re.sub(r'[^ء-ي0-9A-Za-z ]', ' ', s)
              return ' '.join(s.split())
          def n2(s): return re.sub('[قجكغ]', 'Q', norm(s))
          MUST = ['الرياض', 'تعمير', 'ارشيف', 'ارشفه', 'تجديد']
          DIALECT = set(n2(w) for w in 'الحين خلونا ياخذ وش بس تبي تلقاها اللي هالشهر يطلع وش بينتهي يمشون الاثنين ويطلع'.split())
          def hear(y, sr):
              y = librosa.resample(y, orig_sr=sr, target_sr=16000)
              y = np.concatenate([np.zeros(4800), y, np.zeros(16000)]).astype(np.float32)
              st = asr.create_stream(); st.accept_waveform(16000, y); asr.decode_stream(st)
              return st.result.text
          def judge(target, heard):
              a, b = n2(target).split(), n2(heard).split()
              r = difflib.SequenceMatcher(None, ' '.join(a), ' '.join(b)).ratio()
              tail = difflib.SequenceMatcher(None, ' '.join(a[-2:]), ' '.join(b[-2:])).ratio() if a and b else 0
              head = difflib.SequenceMatcher(None, ' '.join(a[:2]), ' '.join(b[:2])).ratio() if a and b else 0
              worst = 1.0
              for w in a:
                  if len(w) < 3: continue
                  best = max([difflib.SequenceMatcher(None, w, x).ratio() for x in b] or [0])
                  if w in DIALECT: best = min(1.0, best + .2)
                  worst = min(worst, best)
              names = all(m in norm(heard) for m in MUST if m in norm(target))
              return r, head, tail, worst, names

          m = ChatterboxMultilingualTTS.from_pretrained(device='cpu')
          ckpt = hf_hub_download('Messam174/Sada-TTS-SA-v1.2', 'model.safetensors')
          res = m.t3.load_state_dict(load_file(ckpt), strict=False); print('sada weights', res, flush=True); assert not res.missing_keys; m.t3.eval()
          ref = hf_hub_download('Messam174/Sada-TTS-SA-v1.2', 'assets/audio/sample_akhuk.wav')
          m.prepare_conditionals(ref, exaggeration=0.3)
          os.makedirs('out', exist_ok=True)
          report = {}
          for scene, lid, text in mine:
              t0 = time.time(); cands = []
              for k in range(8):
                  torch.manual_seed(4242 + 97 * k + len(text))
                  temp = [0.45, 0.45, 0.5, 0.4, 0.45, 0.55, 0.4, 0.5][k]
                  with torch.inference_mode():
                      w = m.generate(text, language_id='ar', exaggeration=0.3, cfg_weight=0.35, temperature=temp,
                                     repetition_penalty=2.5, min_p=0.05, top_p=0.9)
                  y = w.squeeze().numpy()
                  _, idx = librosa.effects.trim(y, top_db=42, frame_length=1024, hop_length=256)
                  y = y[max(0, idx[0] - int(.07 * m.sr)):min(len(y), idx[1] + int(.09 * m.sr))]
                  heard = hear(y, m.sr)
                  r, head, tail, worst, names = judge(text, heard)
                  dur = len(y) / m.sr
                  rate = len(norm(text).replace(' ', '')) / max(dur, .1)
                  ok_rate = 6.0 <= rate <= 15.5
                  score = r + .5 * tail + .3 * head + .8 * worst + (0 if names else -1) - (0 if ok_rate else .5)
                  cands.append(dict(score=score, y=y, r=r, head=head, tail=tail, worst=worst, names=names, heard=heard, dur=dur, rate=rate, k=k))
                  good = [c for c in cands if c['r'] >= .9 and c['worst'] >= .86 and c['names'] and c['head'] >= .7 and c['tail'] >= .7]
                  if len(cands) >= 3 and good: break
              cands.sort(key=lambda c: -c['score'])
              for rank, c in enumerate(cands[:2]):
                  pad = np.zeros(int(.04 * m.sr), dtype=np.float32)
                  sf.write(f'out/{lid}{"" if rank == 0 else "_b"}.wav', np.concatenate([pad, c['y'], pad]), m.sr)
              b = cands[0]
              report[lid] = {k: (round(v, 3) if isinstance(v, float) else v) for k, v in b.items() if k not in ('y', 'score')}
              report[lid].update(text=text, scene=scene, tries=len(cands))
              print(lid, json.dumps(report[lid], ensure_ascii=False), f'{time.time()-t0:.0f}s', flush=True)
          json.dump(report, open(f'out/shard-{SHARD}.json', 'w'), ensure_ascii=False, indent=1)

          PY
      - name: Speak
        run: python gen.py ${{ matrix.shard }} 18
      - name: Publish
        run: gh release upload narration out/* -R "$GITHUB_REPOSITORY" --clobber
