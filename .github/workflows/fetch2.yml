name: Fetch Saudi voice candidates
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: SWivid/Habibi-TTS
            allow: '["Unified/*", "Specialized/SAU/*", "README.md"]'
          - model: NAMAA-Space/NAMAA-Saudi-TTS-V2
            allow: '["model_last.pt", "vocab.txt", "*.json", "*.py", "*.md", "*.wav", "*.txt"]'
          - model: charactr/vocos-mel-24khz
            allow: '["*"]'
          - model: Wittify/Fasee7-Najdi-Small
            allow: '["*"]'
          - model: openbmb/VoxCPM2
            allow: '["*"]'
    env:
      GH_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: /mnt/work/hf
    steps:
      - name: Prepare disk
        run: sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
      - name: Download from Hugging Face
        env:
          REPO: ${{ matrix.model }}
          ALLOW: ${{ matrix.allow }}
        run: |
          pip install -q -U huggingface_hub
          python - <<'PY'
          import json, os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id=os.environ['REPO'], local_dir='/mnt/work/model',
                            allow_patterns=json.loads(os.environ['ALLOW']),
                            token=os.environ.get('HF_TOKEN') or None)
          PY
          find /mnt/work/model -type f -not -path '*/.cache/*' -exec ls -la {} \;
      - name: Publish as a release
        run: |
          TAG=$(echo '${{ matrix.model }}' | sed 's#/#__#')
          gh release delete "$TAG" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          cd /mnt/work
          tar -cf - -C model --exclude=.cache . | split -b 1500m -d -a 2 - "$TAG.tar.part"
          gh release create "$TAG" "$TAG".tar.part* -R "$GITHUB_REPOSITORY" --title '${{ matrix.model }}' --notes 'Copy of https://huggingface.co/${{ matrix.model }} (see its licence there)'
 
